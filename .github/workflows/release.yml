name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish CLI
      run: dotnet publish src/LayoutConverter.Cli/LayoutConverter.Cli.csproj -c Release -r win-x64 --self-contained false -o publish/cli

    - name: Publish GUI
      run: dotnet publish src/LayoutConverter.Gui/LayoutConverter.Gui.csproj -c Release -r win-x64 --self-contained false -o publish/gui

    - name: Assemble Release Files
      shell: pwsh
      run: |
        # CLI Assembly
        New-Item -ItemType Directory -Path Release-Cli -Force
        Copy-Item publish/cli/* Release-Cli -Force
        Copy-Item README.md Release-Cli -Force
        Get-ChildItem Release-Cli -Filter *.pdb | Remove-Item -Force

        # GUI Assembly
        New-Item -ItemType Directory -Path Release-Gui -Force
        Copy-Item publish/gui/* Release-Gui -Force
        Copy-Item README.md Release-Gui -Force
        Get-ChildItem Release-Gui -Filter *.pdb | Remove-Item -Force

    - name: Zip Release Packages
      shell: pwsh
      run: |
        Compress-Archive -Path Release-Cli/* -DestinationPath NW4R-LayoutTools-CLI-${{ github.ref_name }}.zip
        Compress-Archive -Path Release-Gui/* -DestinationPath NW4R-LayoutTools-GUI-${{ github.ref_name }}.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          NW4R-LayoutTools-CLI-${{ github.ref_name }}.zip
          NW4R-LayoutTools-GUI-${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
